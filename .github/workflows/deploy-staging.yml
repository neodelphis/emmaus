name: Déploiement staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag GHCR à déployer (ex. sha-<commit>). Laisser vide pour construire et déployer le commit courant."
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/neodelphis/emmaus
  STAGING_URL: https://emmaus-staging.neodelphis.ovh

jobs:
  tests:
    name: Tests et lint
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.image_tag == '' }}
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: emmaus
          POSTGRES_PASSWORD: emmaus
          POSTGRES_DB: emmaus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emmaus -d emmaus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Installer les dépendances backend
        run: python -m pip install "./backend[dev]"

      - name: Vérifier le lint backend
        working-directory: backend
        run: ruff check app tests

      - name: Exécuter les tests backend
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://emmaus:emmaus@localhost:5432/emmaus_test
        run: pytest

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Vérifier le lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Construire l'interface
        working-directory: frontend
        run: npm run build

  build:
    name: Construire et publier les images
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.image_tag == '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier le backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/backend:staging
            ${{ env.IMAGE_PREFIX }}/backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construire et publier le frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:staging
            ${{ env.IMAGE_PREFIX }}/frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Déployer sur le staging
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '')) }}
    environment:
      name: staging
      url: https://emmaus-staging.neodelphis.ovh
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag || format('sha-{0}', github.sha) }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Copier le Compose staging
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          source: "docker-compose.staging.yml"
          target: ${{ secrets.STAGING_DEPLOY_PATH }}
          overwrite: true
          timeout: 60s
          command_timeout: 2m

      - name: Récupérer les images et redémarrer les services
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_ACTOR,IMAGE_TAG,DEPLOY_PATH
          command_timeout: 10m
          script: |
            set -eu
            cd "$DEPLOY_PATH"

            test -f .env.staging || {
              echo "Fichier .env.staging manquant dans $DEPLOY_PATH." >&2
              exit 1
            }

            docker network inspect proxy-net >/dev/null 2>&1 || {
              echo "Réseau Docker proxy-net introuvable : vérifier le reverse proxy Traefik." >&2
              exit 1
            }

            docker compose --env-file .env.staging -f docker-compose.staging.yml config >/dev/null

            # Jeton éphémère du workflow : il n'est pas stocké durablement sur le serveur.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            docker compose --env-file .env.staging -f docker-compose.staging.yml pull
            docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --no-build

            for container in emmaus-staging-api emmaus-staging-web; do
              attempt=0
              health_status=unknown
              while [ "$attempt" -lt 40 ]; do
                health_status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container" 2>/dev/null || echo missing)
                if [ "$health_status" = "healthy" ] || [ "$health_status" = "unhealthy" ]; then
                  break
                fi
                attempt=$((attempt + 1))
                sleep 3
              done

              if [ "$health_status" != "healthy" ]; then
                echo "Le conteneur $container n'est pas sain (statut: $health_status)." >&2
                docker logs --tail 100 "$container" >&2 || true
                exit 1
              fi
            done

            printf '%s\n' "$IMAGE_TAG" > .deployed-image-tag
            docker compose --env-file .env.staging -f docker-compose.staging.yml ps

      - name: Vérifier l'accès public
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 "$STAGING_URL/" >/dev/null 2>&1 \
              && curl -fsS --max-time 10 "$STAGING_URL/api/health" | grep -q '"status":"ok"'; then
              echo "Staging disponible et API saine (tentative $attempt)."
              exit 0
            fi
            sleep 5
          done

          echo "Staging indisponible après 300 secondes." >&2
          echo "Frontend : $(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$STAGING_URL/" || true)"
          echo "API      : $(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$STAGING_URL/api/health" || true)"
          exit 1
